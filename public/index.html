<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecureBlog v1 — Session</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="login-view" class="screen">
      <article class="card">
        <p class="kicker">Fil rouge authentification</p>
        <h1>SecureBlog</h1>
        <p class="subtitle">v1 — Session</p>
        <h2>Connexion</h2>
        <form id="login-form">
          <input
            name="email"
            type="email"
            placeholder="Email"
            aria-label="Email"
            autocomplete="username"
            required
          />
          <input
            name="password"
            type="password"
            placeholder="Mot de passe (8 caractères minimum)"
            aria-label="Mot de passe"
            minlength="8"
            autocomplete="current-password"
            required
          />
          <p id="login-error" class="error" hidden></p>
          <button type="submit">Se connecter</button>
        </form>
        <button id="show-register" class="text-link" type="button">Créer un compte</button>
      </article>
    </main>

    <main id="register-view" class="screen" hidden>
      <article class="card">
        <p class="kicker">Fil rouge authentification</p>
        <h1>SecureBlog</h1>
        <p class="subtitle">v1 — Session</p>
        <h2>Inscription</h2>
        <form id="register-form">
          <input
            name="email"
            type="email"
            placeholder="Email"
            aria-label="Email"
            autocomplete="username"
            required
          />
          <input
            name="password"
            type="password"
            placeholder="Mot de passe (8 caractères minimum)"
            aria-label="Mot de passe"
            minlength="8"
            autocomplete="new-password"
            required
          />
          <p id="register-error" class="error" hidden></p>
          <button type="submit">Créer le compte</button>
        </form>
        <button id="show-login" class="text-link" type="button">J'ai déjà un compte</button>
      </article>
    </main>

    <main id="app-view" class="screen" hidden>
      <section class="shell">
        <header class="app-header">
          <div>
            <p class="kicker">Fil rouge authentification</p>
            <h1>SecureBlog</h1>
            <p class="subtitle">v1 — Session</p>
          </div>
          <button id="logout" class="ghost" type="button">Se déconnecter</button>
        </header>

        <section class="panel">
          <p class="welcome">Bienvenue, <strong id="welcome-email"></strong></p>
          <p class="hint">Votre session est protégée par un cookie HttpOnly.</p>
          <form id="post-form">
            <input name="title" type="text" placeholder="Titre" aria-label="Titre" maxlength="120" required />
            <textarea name="content" placeholder="Contenu" aria-label="Contenu" maxlength="5000" rows="3" required></textarea>
            <p id="post-error" class="error" hidden></p>
            <button type="submit">Publier</button>
          </form>
        </section>

        <section class="articles">
          <h2>Articles</h2>
          <div id="articles"></div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
